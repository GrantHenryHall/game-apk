plugins {
    id 'com.android.application'
}

android {
    namespace 'com.critterarena.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.critterarena.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Two editions built from the same WebView shell, installable side by side:
    //   classic -> the original game in ../www  (com.critterarena.game)
    //   stadium -> Critter Arena 2 in ../www2   (com.critterarena.game2)
    flavorDimensions.add('edition')
    productFlavors {
        classic {
            dimension 'edition'
            applicationId "com.critterarena.game"
        }
        stadium {
            dimension 'edition'
            applicationId "com.critterarena.game2"
            versionCode 2
            versionName "2.0"
        }
    }

    // Bundle each edition's web game directly as Android assets so it runs offline.
    sourceSets {
        classic {
            assets.srcDirs += ['../www']
        }
        stadium {
            assets.srcDirs += ['../www2']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // debug builds are signed with the auto-generated debug keystore and
            // are directly installable on a phone (enable "install unknown apps").
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies — uses the framework WebView + Activity only.
}
