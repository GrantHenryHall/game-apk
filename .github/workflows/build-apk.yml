name: Build Android APK

on:
  push:
    branches:
      - "claude/**"
      - "ccr-**"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the legacy 'tools' package (the action's default) no longer exists in cmdline-tools 16+
          packages: platform-tools

      - name: Install Android platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CritterArena.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CritterArena-APK
          path: out/CritterArena.apk
          if-no-files-found: error

      - name: Publish APK to Release (easy phone download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: critter-arena-apk
          target_commitish: ${{ github.sha }}
          name: "Critter Arena — latest APK"
          body: |
            Latest installable debug build of **Critter Arena**, a real-time creature autobattler.

            **Install on your phone:**
            1. Tap `CritterArena.apk` below to download.
            2. Open it; if prompted, allow installing apps from this source.
            3. Launch **Critter Arena** and take on the Sunshine League!

            Built automatically from commit ${{ github.sha }}.
          prerelease: true
          files: out/CritterArena.apk
