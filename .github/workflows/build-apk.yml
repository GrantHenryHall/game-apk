name: Build Android APK

on:
  push:
    branches:
      - "claude/**"
      - "ccr-**"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the legacy 'tools' package (the action's default) no longer exists in cmdline-tools 16+
          packages: platform-tools

      - name: Install Android platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APKs (classic + Critter Arena 2)
        run: gradle assembleClassicDebug assembleStadiumDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/classic/debug/app-classic-debug.apk "out/CritterArena.apk"
          cp app/build/outputs/apk/stadium/debug/app-stadium-debug.apk "out/CritterArena2.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CritterArena-APKs
          path: out/*.apk
          if-no-files-found: error

      # Only Critter Arena 2 is published; the original game's release (critter-arena-apk) is left as it was.
      - name: Publish Critter Arena 2 to its own Release (easy phone download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: critter-arena-2-apk
          target_commitish: ${{ github.sha }}
          name: "Critter Arena 2 — latest APK"
          body: |
            Latest installable debug build of **Critter Arena 2**: stadium edition with evolution,
            crowd boosts, tournaments and more. Installs alongside the original Critter Arena.

            **Install on your phone:**
            1. Tap `CritterArena2.apk` below to download.
            2. Open it; if prompted, allow installing apps from this source.
            3. Launch **Critter Arena 2** and take on the Sunshine League!

            Built automatically from commit ${{ github.sha }}.
          prerelease: true
          files: out/CritterArena2.apk
