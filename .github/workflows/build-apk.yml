name: Build Android APK

on:
  push:
    branches:
      - "claude/**"
      - "ccr-**"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the legacy 'tools' package (the action's default) no longer exists in cmdline-tools 16+
          packages: platform-tools

      - name: Install Android platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APKs (classic, Critter Arena 2, 3 and 4)
        run: gradle assembleClassicDebug assembleStadiumDebug assembleJourneyDebug assembleAdventureDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/classic/debug/app-classic-debug.apk "out/CritterArena.apk"
          cp app/build/outputs/apk/stadium/debug/app-stadium-debug.apk "out/CritterArena2.apk"
          cp app/build/outputs/apk/journey/debug/app-journey-debug.apk "out/CritterArena3.apk"
          cp app/build/outputs/apk/adventure/debug/app-adventure-debug.apk "out/CritterArena4.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CritterArena-APKs
          path: out/*.apk
          if-no-files-found: error

      # Only Critter Arena 4 is published; the earlier editions' releases are left as they were.
      - name: Publish Critter Arena 4 to its own Release (easy phone download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: critter-arena-4-apk
          target_commitish: ${{ github.sha }}
          name: "Critter Arena 4 — latest APK"
          body: |
            Latest installable debug build of **Critter Arena 4**: the adventure edition. Walk a whole
            sunny region on foot: tall grass, trainers who spot you, towns, shops, gyms and your rival,
            with your lead critter following behind you. Installs alongside Critter Arena 1, 2 and 3.

            **Install on your phone:**
            1. Tap `CritterArena4.apk` below to download.
            2. Open it; if prompted, allow installing apps from this source.
            3. Launch **Critter Arena 4** and start your adventure!

            Built automatically from commit ${{ github.sha }}.
          prerelease: true
          files: out/CritterArena4.apk
