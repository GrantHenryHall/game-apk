plugins {
    id 'com.android.application'
}

// CI stamps every build with a rising version code so a new APK always installs over the old one.
def ciBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

// Each edition is its own app on the phone: its own package id, name and download link, so a new
// edition installs next to the earlier ones instead of replacing them. The original app (edition 1)
// is "com.sunlings.arena". Bump the number in arena/EDITION to start another side-by-side edition.
def edition = file('EDITION').text.trim()
if (!(edition ==~ /[0-9]+/)) throw new GradleException("arena/EDITION must hold a whole number, found '${edition}'")

android {
    namespace 'com.sunlings.arena'
    compileSdk 34

    defaultConfig {
        applicationId "com.sunlings.arena.v${edition}"
        minSdk 26
        targetSdk 34
        versionCode ciBuild
        versionName "${edition}.0.${ciBuild}"
        // short enough that a home screen shows the number instead of cutting it off
        resValue "string", "app_name", "Sunlings ${edition}"
        resValue "string", "edition", edition
    }

    // A fixed debug key that lives in the repo, so builds from different CI runs share one
    // signature and update each other in place (a per-run key would force an uninstall first).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies: framework WebView + Activity only.
    // The game itself lives in src/main/assets (index.html + js/) and runs fully offline.
}
