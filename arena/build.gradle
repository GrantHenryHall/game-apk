plugins {
    id 'com.android.application'
}

// CI stamps every build with a rising version code so a new APK always installs over the old one.
def ciBuild = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.sunlings.arena'
    compileSdk 34

    defaultConfig {
        applicationId "com.sunlings.arena"
        minSdk 26
        targetSdk 34
        versionCode ciBuild
        versionName "1.0.${ciBuild}"
    }

    // A fixed debug key that lives in the repo, so builds from different CI runs share one
    // signature and update each other in place (a per-run key would force an uninstall first).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies: framework WebView + Activity only.
    // The game itself lives in src/main/assets (index.html + js/) and runs fully offline.
}
