<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="tigerTitle tigerDesc">
  <title id="tigerTitle">Tiger</title>
  <desc id="tigerDesc">A stylised tiger seen from the side, walking to the right, with orange fur, black stripes, a cream belly and a ringed tail.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D64"/>
      <stop offset="1" stop-color="#0E3228"/>
    </linearGradient>
    <linearGradient id="fur" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="440">
      <stop offset="0" stop-color="#F9AA34"/>
      <stop offset="1" stop-color="#E87813"/>
    </linearGradient>
    <linearGradient id="furFar" gradientUnits="userSpaceOnUse" x1="0" y1="260" x2="0" y2="440">
      <stop offset="0" stop-color="#D8751A"/>
      <stop offset="1" stop-color="#BD5B0E"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="1" stop-color="#E09A12"/>
    </radialGradient>

    <path id="torso" d="M208 214 C240 192 300 186 360 190 C420 194 470 196 520 186 C550 180 580 168 606 150 L680 240 C650 270 620 290 600 312 C580 326 540 322 500 318 C440 314 380 306 330 292 C300 300 250 310 222 300 C196 282 192 240 208 214 Z"/>
    <path id="legFrontNear" d="M528 262 C524 310 536 356 540 396 L538 418 Q537 434 552 434 L592 434 Q604 434 601 421 Q597 409 580 407 C582 372 596 330 604 290 C606 270 560 240 528 262 Z"/>
    <path id="legHindNear" d="M236 206 C200 232 188 276 198 318 C204 344 196 362 186 384 L178 414 Q174 434 192 434 L234 434 Q246 434 243 421 Q239 410 220 408 L228 388 C250 362 300 344 334 300 C344 262 330 222 300 204 Z"/>
    <path id="head" d="M604 168 C606 142 632 128 660 132 C680 135 694 148 702 162 C712 170 724 178 732 188 C736 194 734 202 728 206 C730 214 726 222 718 226 C716 238 706 246 692 246 C676 248 660 250 648 254 L630 268 L626 250 L606 256 L610 236 C600 216 600 190 604 168 Z"/>

    <clipPath id="torsoClip"><use href="#torso"/></clipPath>
    <clipPath id="bodyClip">
      <use href="#torso"/>
      <use href="#legFrontNear"/>
      <use href="#legHindNear"/>
    </clipPath>
    <clipPath id="headClip"><use href="#head"/></clipPath>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="520" rx="36" fill="url(#bg)"/>
  <circle cx="420" cy="250" r="176" fill="#FFD27A" opacity="0.14"/>
  <path d="M0 440 Q400 418 800 440 V484 Q800 520 764 520 H36 Q0 520 0 484 Z" fill="#0A261E" opacity="0.55"/>
  <ellipse cx="410" cy="438" rx="300" ry="13" fill="#000000" opacity="0.28"/>

  <!-- Tail -->
  <g fill="none" stroke-width="22">
    <path d="M214 226 C160 232 122 284 112 338 C106 372 84 388 64 368" stroke="url(#fur)" stroke-linecap="round"/>
    <path d="M214 226 C160 232 122 284 112 338 C106 372 84 388 64 368" stroke="#1E1410" stroke-dasharray="9 21" stroke-dashoffset="-34"/>
    <path d="M93.25 373.25 C84.5 379 74 378 64 368" stroke="#1E1410" stroke-linecap="round"/>
  </g>

  <!-- Far-side legs -->
  <g fill="url(#furFar)">
    <path d="M572 280 C596 320 628 366 640 398 L639 418 Q639 432 653 432 L692 432 Q703 432 700 420 Q696 408 678 406 C668 364 644 316 622 282 Z"/>
    <path d="M286 280 C306 322 334 352 340 384 L343 416 Q344 432 358 432 L396 432 Q407 432 404 420 Q400 408 382 406 C378 364 366 322 352 286 Z"/>
  </g>
  <g fill="#1E1410" opacity="0.8">
    <path d="M604 330 Q622 334 640 350 Q620 346 610 344 Z"/>
    <path d="M622 364 Q640 366 656 382 Q638 378 628 378 Z"/>
    <path d="M318 336 Q340 334 362 346 Q340 346 324 350 Z"/>
    <path d="M334 368 Q354 366 372 378 Q352 378 338 382 Z"/>
  </g>

  <!-- Torso -->
  <use href="#torso" fill="url(#fur)"/>
  <g clip-path="url(#torsoClip)" fill="#FFF3DC">
    <path d="M610 300 C560 306 440 300 332 280 C310 284 292 296 280 312 L280 340 L620 340 Z"/>
    <path d="M704 232 C668 260 636 290 612 324 L578 328 C598 290 624 254 660 222 Z"/>
  </g>

  <!-- Near-side legs -->
  <use href="#legHindNear" fill="url(#fur)"/>
  <use href="#legFrontNear" fill="url(#fur)"/>

  <!-- Stripes over torso and near-side legs -->
  <g clip-path="url(#bodyClip)" fill="#1E1410">
    <!-- from the spine down -->
    <path d="M252 176 Q254 213 252 250 Q268 213 272 176 Z"/>
    <path d="M289 176 Q292.7 222 294 268 Q308.6 222 311 176 Z"/>
    <path d="M330 176 Q334.4 219 338 262 Q349.2 219 350 176 Z"/>
    <path d="M367 176 Q373.1 223 380 270 Q389.8 223 389 176 Z"/>
    <path d="M406 176 Q412.2 218 420 260 Q427.6 218 426 176 Z"/>
    <path d="M443 176 Q450.3 224 460 272 Q467.4 224 465 176 Z"/>
    <path d="M482 176 Q489.4 220 500 264 Q505.2 220 502 176 Z"/>
    <path d="M518 172 Q526 216 538 256 Q542 216 538 172 Z"/>
    <!-- neck -->
    <path d="M556 170 C566 198 576 224 592 250 C572 232 556 208 542 178 Z"/>
    <path d="M584 156 C596 184 608 206 628 228 C604 212 586 192 570 166 Z"/>
    <!-- from the belly up -->
    <path d="M350 322 Q356 290 362 262 Q366 292 368 322 Z"/>
    <path d="M389 326 Q395 296 401 268 Q405 298 407 326 Z"/>
    <path d="M428 328 Q434 298 440 270 Q444 300 446 328 Z"/>
    <path d="M466 330 Q472 300 478 272 Q482 302 484 330 Z"/>
    <!-- haunch and hind leg -->
    <path d="M186 258 C216 258 242 270 262 290 C238 284 214 282 188 284 Z"/>
    <path d="M190 304 C220 300 246 310 266 328 C242 322 218 322 194 328 Z"/>
    <path d="M186 350 Q212 352 238 368 Q212 364 190 366 Z"/>
    <path d="M176 388 Q200 388 226 398 Q200 398 178 402 Z"/>
    <!-- foreleg -->
    <path d="M518 306 C540 304 558 310 570 322 C554 320 538 322 520 328 Z"/>
    <path d="M524 344 C544 342 560 348 570 358 C556 356 542 358 528 364 Z"/>
    <path d="M532 380 Q552 380 568 390 Q550 390 536 394 Z"/>
  </g>

  <!-- Toes -->
  <g fill="none" stroke="#1E1410" stroke-width="2.6" stroke-linecap="round" opacity="0.55">
    <path d="M574 421 V433 M587 422 V433"/>
    <path d="M216 421 V433 M229 422 V433"/>
    <path d="M674 420 V431 M687 421 V431"/>
    <path d="M378 420 V431 M391 421 V431"/>
  </g>

  <!-- Ear (tucked behind the skull) -->
  <path d="M606 158 C597 122 614 98 634 102 C653 106 659 134 650 158 Z" fill="#1E1410"/>
  <path d="M617 154 C612 128 622 114 634 117 C645 120 647 138 643 154 Z" fill="#FFE9C8"/>

  <!-- Head -->
  <use href="#head" fill="url(#fur)"/>
  <g clip-path="url(#headClip)">
    <path d="M740 198 C724 196 706 200 696 208 C686 216 684 228 674 236 C658 246 634 238 610 224 L590 276 L744 276 Z" fill="#FFF5E2"/>
    <ellipse cx="684" cy="160" rx="13" ry="6" fill="#FFF3DC" transform="rotate(24 684 160)"/>
    <g fill="#1E1410">
      <path d="M640 126 C647 140 647 152 642 164 C638 152 636 140 630 128 Z"/>
      <path d="M662 126 C667 138 667 148 662 158 C658 148 656 138 652 128 Z"/>
      <path d="M682 134 C685 142 684 150 680 156 C677 150 676 142 673 134 Z"/>
      <path d="M660 174 C644 188 642 208 651 226 C650 208 652 190 660 174 Z"/>
      <path d="M638 178 C622 194 620 214 630 232 C628 214 630 196 638 178 Z"/>
      <path d="M617 184 C603 200 602 218 610 234 C608 218 610 202 617 184 Z"/>
    </g>
  </g>

  <!-- Eye -->
  <path d="M697 172 Q704 180 704 190 Q698 182 692 178 Z" fill="#1E1410"/>
  <path d="M672 173 Q686 160 699 172 Q686 181 672 173 Z" fill="url(#iris)" stroke="#1E1410" stroke-width="3.6" stroke-linejoin="round"/>
  <circle cx="687" cy="171" r="3.8" fill="#120B08"/>
  <circle cx="688.6" cy="169.4" r="1.3" fill="#FFFFFF"/>

  <!-- Whiskers -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <path d="M708 209 Q676 204 642 188"/>
    <path d="M706 213 Q672 216 636 208"/>
    <path d="M706 217 Q676 230 642 228"/>
  </g>

  <!-- Nose and mouth -->
  <path d="M721 184 C730 183 737 192 734 201 C730 205 723 203 721 197 Z" fill="#E96C7A" stroke="#1E1410" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M727 206 C718 215 704 221 688 224" fill="none" stroke="#1E1410" stroke-width="3" stroke-linecap="round"/>
  <g fill="#1E1410">
    <circle cx="710" cy="209" r="1.7"/>
    <circle cx="703" cy="213" r="1.7"/>
    <circle cx="713" cy="215" r="1.7"/>
  </g>
</svg>
