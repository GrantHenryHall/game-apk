<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="tigerTitle tigerDesc">
  <title id="tigerTitle">Tiger</title>
  <desc id="tigerDesc">A stylised front-facing tiger head with orange fur, black stripes, cream cheeks and amber eyes on a jungle-green disc.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#2E7D64"/>
      <stop offset="1" stop-color="#0E3228"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A732"/>
      <stop offset="1" stop-color="#E87813"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="0.65" stop-color="#F4B41F"/>
      <stop offset="1" stop-color="#B46E08"/>
    </radialGradient>

    <path id="headShape" d="M256 92 C318 92 372 116 400 166 C418 198 426 240 422 282 L448 322 L420 334 L434 374 L400 380 C372 424 318 446 256 446 C194 446 140 424 112 380 L78 374 L92 334 L64 322 L90 282 C86 240 94 198 112 166 C140 116 194 92 256 92 Z"/>
    <clipPath id="headClip"><use href="#headShape"/></clipPath>

    <!-- Everything that is mirrored left/right, drawn for the viewer's left side -->
    <g id="ear">
      <circle cx="122" cy="112" r="58" fill="#1E1410"/>
      <circle cx="126" cy="116" r="47" fill="url(#fur)"/>
      <circle cx="130" cy="122" r="33" fill="#3A2318"/>
      <ellipse cx="134" cy="128" rx="22" ry="24" fill="#FFE9C8"/>
    </g>

    <g id="cheekFur">
      <ellipse cx="80" cy="356" rx="72" ry="82" fill="#FFF3DC"/>
    </g>

    <g id="sideStripes" fill="#1E1410">
      <path d="M96 178 C132 180 160 192 182 212 C156 204 128 200 92 202 Z"/>
      <path d="M80 232 C112 232 138 242 156 258 C132 252 108 252 78 258 Z"/>
      <path d="M68 298 C102 292 130 298 150 314 C126 312 102 316 68 324 Z"/>
      <path d="M84 350 C116 342 142 346 162 358 C138 358 116 366 90 380 Z"/>
      <path d="M170 100 C184 126 188 150 184 174 C172 152 162 132 148 112 Z"/>
      <path d="M208 92 C218 116 222 138 218 160 C208 140 200 120 190 98 Z"/>
    </g>

    <g id="eye">
      <g transform="rotate(10 196 256)">
        <ellipse cx="192" cy="246" rx="40" ry="27" fill="#FFF3DC"/>
        <path d="M224 258 Q244 268 246 292 Q236 276 218 270 Z" fill="#1E1410"/>
        <path d="M162 258 Q196 228 230 262 Q196 284 162 258 Z" fill="url(#iris)" stroke="#1E1410" stroke-width="7" stroke-linejoin="round"/>
        <circle cx="197" cy="257" r="10" fill="#120B08"/>
        <circle cx="202" cy="251" r="3.6" fill="#FFFFFF"/>
      </g>
    </g>

    <g id="muzzleSide">
      <ellipse cx="218" cy="358" rx="52" ry="42" fill="#FFF8EA"/>
      <g fill="#1E1410">
        <circle cx="212" cy="346" r="3"/>
        <circle cx="194" cy="352" r="3"/>
        <circle cx="206" cy="362" r="3"/>
        <circle cx="188" cy="368" r="3"/>
        <circle cx="222" cy="372" r="3"/>
      </g>
    </g>

    <g id="whiskers" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.92">
      <path d="M194 352 Q130 328 54 336"/>
      <path d="M188 368 Q122 366 48 384"/>
      <path d="M200 378 Q138 394 76 420"/>
    </g>
  </defs>

  <!-- Backdrop -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <!-- Ears -->
  <use href="#ear"/>
  <use href="#ear" transform="translate(512 0) scale(-1 1)"/>

  <!-- Head -->
  <use href="#headShape" fill="url(#fur)"/>

  <g clip-path="url(#headClip)">
    <!-- Cream cheek ruffs and chin -->
    <use href="#cheekFur"/>
    <use href="#cheekFur" transform="translate(512 0) scale(-1 1)"/>
    <ellipse cx="256" cy="446" rx="150" ry="66" fill="#FFF3DC"/>

    <!-- Stripes -->
    <use href="#sideStripes"/>
    <use href="#sideStripes" transform="translate(512 0) scale(-1 1)"/>
    <g fill="#1E1410">
      <path d="M256 90 C265 116 265 140 256 166 C247 140 247 116 256 90 Z"/>
      <path d="M216 178 Q256 196 296 178 Q256 210 216 178 Z"/>
      <path d="M230 206 Q256 218 282 206 Q256 230 230 206 Z"/>
    </g>
  </g>

  <!-- Nose bridge -->
  <path d="M234 232 C240 264 234 290 224 304 Q256 292 288 304 C278 290 272 264 278 232 Q256 240 234 232 Z" fill="#FBBB58"/>

  <!-- Eyes -->
  <use href="#eye"/>
  <use href="#eye" transform="translate(512 0) scale(-1 1)"/>

  <!-- Whiskers -->
  <use href="#whiskers"/>
  <use href="#whiskers" transform="translate(512 0) scale(-1 1)"/>

  <!-- Muzzle and chin -->
  <ellipse cx="256" cy="402" rx="46" ry="30" fill="#FFF8EA"/>
  <use href="#muzzleSide"/>
  <use href="#muzzleSide" transform="translate(512 0) scale(-1 1)"/>

  <!-- Mouth -->
  <path d="M234 384 Q256 408 278 384 Q256 392 234 384 Z" fill="#7A2B33"/>
  <path d="M256 338 V362 M256 362 C248 382 222 388 204 374 M256 362 C264 382 290 388 308 374" fill="none" stroke="#1E1410" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nose -->
  <path d="M224 302 Q256 292 288 302 Q288 322 256 340 Q224 322 224 302 Z" fill="#E96C7A" stroke="#1E1410" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="256" cy="306" rx="18" ry="5" fill="#FFFFFF" opacity="0.35"/>

</svg>
